name: Legal Site Source Check

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Yasal site kaynaklarını doğrula
        run: |
          set -euo pipefail
          test -s docs/index.html
          grep -Fq 'PDF Okuyucu' docs/privacy-policy.html
          grep -Fxq 'google.com, pub-1380972808968213, DIRECT, f08c47fec0942fa0' docs/app-ads.txt
          echo 'Kaynaklar hazır. Bunları public MrZekai/MrZekai.github.io reposunun kökünde yayınlayın.'
