name: Expo Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_release:
        description: 'İmzalı Play Store AAB üret'
        required: true
        default: true
        type: boolean
      release_target:
        description: 'AAB hedefi'
        required: true
        default: 'closed_test'
        type: choice
        options:
          - closed_test
          - production

permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_ADMOB_APP_ID_ANDROID: ca-app-pub-1380972808968213~3816043340
      EXPO_PUBLIC_ADMOB_BANNER_ANDROID: ca-app-pub-1380972808968213/7265047779
      EXPO_PUBLIC_ADMOB_APP_OPEN_ANDROID: ca-app-pub-1380972808968213/1189880008
      # Kotlin derleyicisi ayri bir daemon'da calisir ve varsayilan heap'i
      # bu bagimlilik grafigi icin yetersiz kalabiliyor. Bellek kaynakli
      # "internal compiler error" ihtimalini elemek icin acikca yukseltiliyor.
      GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8'
    steps:
      - name: Runner disk alanını boşalt
        shell: bash
        run: |
          set -euo pipefail
          echo 'Temizlik öncesi disk:'
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/system-images /usr/local/lib/android/sdk/emulator || true
          docker system prune --all --force --volumes || true
          sudo apt-get clean
          echo 'Temizlik sonrası disk:'
          df -h /
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Bağımlılıkları kur
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Expo sürüm uyumunu doğrula (bilgilendirme)
        continue-on-error: true
        run: npx expo install --check

      - name: Kod ve release yapılandırmasını kontrol et
        run: |
          npm run check
          npm run lint
          npm run doctor
          npm run release:check

      - name: Closed-test yasal kaynaklarını doğrula
        if: github.event_name == 'workflow_dispatch' && inputs.build_release && inputs.release_target == 'closed_test'
        run: |
          set -euo pipefail
          grep -Fq 'PDF: Okuyucu - Araçları' docs/privacy-policy.html
          grep -Fq 'PDF: Reader - Tools' docs/privacy-policy.html
          tr -d '\r' < docs/app-ads.txt | \
            grep -Fxq 'google.com, pub-1380972808968213, DIRECT, f08c47fec0942fa0'
          echo 'Closed-test yasal kaynakları doğrulandı; GitHub Pages deploy gecikmesi AAB buildini engellemeyecek.'

      - name: Canlı gizlilik politikası ve app-ads.txt dosyasını doğrula
        if: github.event_name == 'workflow_dispatch' && inputs.build_release && inputs.release_target == 'production'
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 20 \
            https://mrzekai.github.io/privacy-policy.html | grep -Fq 'PDF: Okuyucu - Araçları'
          curl --fail --silent --show-error --location --max-time 20 \
            https://mrzekai.github.io/app-ads.txt | tr -d '\r' | \
            grep -Fxq 'google.com, pub-1380972808968213, DIRECT, f08c47fec0942fa0'
          echo 'Production canlı yasal sayfaları doğrulandı.'

      - name: Android projesini üret
        run: npx expo prebuild --platform android --clean --no-install

      - name: Toolchain ve Ads SDK sabitlemesini doğrula
        run: |
          set -euo pipefail
          grep -Fxq 'android.compileSdkVersion=36' android/gradle.properties
          grep -Fxq 'android.targetSdkVersion=36' android/gradle.properties
          grep -Fxq 'android.kotlinVersion=2.1.20' android/gradle.properties
          grep -Fxq 'android.enableMinifyInReleaseBuilds=true' android/gradle.properties
          grep -Fxq 'android.enableShrinkResourcesInReleaseBuilds=true' android/gradle.properties
          grep -Fq 'withAdsSdkPin' android/build.gradle
          grep -Fq "useVersion '24.6.0'" android/build.gradle
          grep -Fq "pinned.contains(details.requested.name)" android/build.gradle
          # play-services-ads-identifier BAGIMSIZ surum hattinda (18.x).
          # Onu force etmek "Could not find ...-identifier:24.6.0" hatasi verir.
          if grep -Fq "startsWith('play-services-ads')" android/build.gradle; then
            echo 'HATA: prefix eslesmesi geri gelmis; identifier artefakti kirilir.' >&2
            exit 1
          fi
          echo 'API 36, Kotlin 2.1.20, R8/resource shrink ve play-services-ads 24.6.0 sabitlemesi yerinde.'

      - name: Gereksiz Android izinlerini doğrula
        run: |
          if grep -E 'android.permission.(SYSTEM_ALERT_WINDOW|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE)' android/app/src/main/AndroidManifest.xml | grep -vq 'tools:node="remove"'; then
            echo 'Gereksiz veya riskli Android izni bulundu.' >&2
            exit 1
          fi

      - name: AdMob App ID manifeste işlendi mi
        run: grep -Fq 'ca-app-pub-1380972808968213~3816043340' android/app/src/main/AndroidManifest.xml

      - name: Android dil ve uygulama adı yerelleştirmesini doğrula
        run: |
          set -euo pipefail
          while IFS='|' read -r locale app_name; do
            grep -Fq "<locale android:name=\"$locale\"/>" android/app/src/main/res/xml/locales_config.xml
            grep -RFq "$app_name" "android/app/src/main/res/values-b+$locale"
          done <<'LOCALES'
          en|PDF: Reader - Tools
          tr|PDF: Okuyucu - Araçları
          es|Lector PDF
          pt|Leitor de PDF
          de|PDF-Reader
          fr|Lecteur PDF
          it|Lettore PDF
          ru|PDF-ридер
          hi|PDF रीडर
          id|Pembaca PDF
          ar|قارئ PDF
          ja|PDFリーダー
          ko|PDF 리더
          zh|PDF 阅读器
          LOCALES
          echo '14 Android sistem dili ve yerelleştirilmiş uygulama adları hazır.'

      # ─── Standalone QA APK ────────────────────────────────────────────────────
      # pipefail sayesinde tee kullanilmasina ragmen gradlew'in cikis kodu korunur.
      - name: Gradle öncesi disk alanını kontrol et
        run: |
          npm cache clean --force || true
          df -h /
      - name: Standalone QA APK derle
        if: github.event_name == 'push'
        id: qa_build
        working-directory: android
        env:
          # Google'ın resmi demo birimleri: QA release APK'sında canlı reklam olmaz.
          EXPO_PUBLIC_ADMOB_BANNER_ANDROID: ca-app-pub-3940256099942544/9214589741
          EXPO_PUBLIC_ADMOB_APP_OPEN_ANDROID: ca-app-pub-3940256099942544/9257395921
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --no-build-cache --max-workers=2 --stacktrace --console=plain --warning-mode=summary 2>&1 | tee ../gradle-qa.log

      - name: QA APK reklam kimliklerini doğrula
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          qa_apk='android/app/build/outputs/apk/release/app-release.apk'
          unzip -p "$qa_apk" assets/app.config > qa-app.config.json
          grep -Fq 'ca-app-pub-3940256099942544/9214589741' qa-app.config.json
          grep -Fq 'ca-app-pub-3940256099942544/9257395921' qa-app.config.json
          if grep -Eq '7265047779|1189880008' qa-app.config.json; then
            echo 'HATA: QA APK içinde production reklam birimi bulundu.' >&2
            exit 1
          fi
          echo 'QA APK yalnızca Google demo reklam birimlerini kullanıyor.'

      - name: QA APK 16 KB ZIP ve ELF hizalamasını doğrula
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          qa_apk='android/app/build/outputs/apk/release/app-release.apk'
          zipalign_bin=$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)
          test -x "$zipalign_bin"
          "$zipalign_bin" -c -P 16 -v 4 "$qa_apk"
          command -v readelf >/dev/null
          native_dir=$(mktemp -d)
          trap 'rm -rf "$native_dir"' EXIT
          unzip -q "$qa_apk" 'lib/*/*.so' -d "$native_dir"
          found=0
          while IFS= read -r so; do
            found=1
            while IFS= read -r alignment; do
              if (( alignment < 0x4000 )); then
                echo "HATA: $so içindeki LOAD segmenti 16 KB hizalı değil: $alignment" >&2
                exit 1
              fi
            done < <(readelf -lW "$so" | awk '$1 == "LOAD" { print $NF }')
          done < <(find "$native_dir/lib" \( -path '*/arm64-v8a/*.so' -o -path '*/x86_64/*.so' \) -type f)
          if (( found == 0 )); then
            echo 'HATA: QA APK içinde doğrulanacak 64-bit native kitaplık bulunamadı.' >&2
            exit 1
          fi
          echo 'QA APK ZIP hizalaması ve 64-bit ELF LOAD segmentleri 16 KB uyumlu.'

      # ─── Hata durumunda tanilama toplama ────────────────────────────────
      - name: Kotlin derleyici tanılama dosyalarını topla
        if: failure()
        run: |
          set +e
          mkdir -p diagnostics
          tail -n 5000 gradle-qa.log > diagnostics/gradle-debug-tail.log 2>/dev/null || true

          echo '--- Kotlin errors dizinleri araniyor ---' | tee diagnostics/00-search.txt
          for dir in \
            "$GITHUB_WORKSPACE/.gradle/kotlin/errors" \
            "$GITHUB_WORKSPACE/android/.gradle/kotlin/errors" \
            "$HOME/.gradle/kotlin/errors" \
            "$HOME/.kotlin/errors"; do
            if [ -d "$dir" ]; then
              echo "BULUNDU: $dir" | tee -a diagnostics/00-search.txt
              find "$dir" -type f | tee -a diagnostics/00-search.txt
              mkdir -p "diagnostics/kotlin-errors"
              find "$dir" -type f -size -10M 2>/dev/null | head -20 | while read -r f; do
            cp "$f" "diagnostics/kotlin-errors/$(basename "$f")" 2>/dev/null || true
          done
            else
              echo "yok: $dir" | tee -a diagnostics/00-search.txt
            fi
          done

          echo '--- Genis arama (errors*.log / kotlin-daemon) ---' | tee -a diagnostics/00-search.txt
          find "$GITHUB_WORKSPACE" "$HOME/.gradle" "$HOME/.kotlin" \
               -maxdepth 8 -type f \( -name 'errors*.log' -o -name 'kotlin-daemon*.log' \) \
               2>/dev/null | tee -a diagnostics/00-search.txt | while read -r f; do
            safe=$(echo "$f" | tr '/' '_')
            cp "$f" "diagnostics/$safe" 2>/dev/null
          done

          echo '--- Toplanan Kotlin tanılama dosyalarının içeriği ---'
          find diagnostics -name 'errors*.log' -o -path '*kotlin-errors*' -type f | while read -r f; do
            echo "════════ $f ════════"
            sed -n '1,200p' "$f"
          done

          echo '--- gradle-qa.log içindeki FAILED / e: satırları ---' | tee diagnostics/01-summary.txt
          grep -nE '^e: |FAILED|Caused by:|Internal compiler error|Exception in type checkers|incompatible version of Kotlin' \
            gradle-qa.log | head -120 | tee -a diagnostics/01-summary.txt
          exit 0

      - name: Tanılama dosyalarını yükle
        if: false  # PLAN2: Actions artifact quota bypass
        uses: actions/upload-artifact@v6
        with:
          name: build-diagnostics-v${{ github.run_number }}
          path: diagnostics
          retention-days: 14
          if-no-files-found: warn

      - name: Standalone QA APK'yı yükle
        if: false  # PLAN2: Actions artifact quota bypass
        uses: actions/upload-artifact@v6
        with:
          name: pdf-okuyucu-standalone-qa-apk-v${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      # ─── İmzalı Play Store AAB ──────────────────────────────────────────
      - name: AAB signing secrets preflight
        if: github.event_name == 'workflow_dispatch' && inputs.build_release
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for pair in             "ANDROID_UPLOAD_KEYSTORE_BASE64:$KEYSTORE_BASE64"             "ANDROID_UPLOAD_STORE_PASSWORD:$STORE_PASSWORD"             "ANDROID_UPLOAD_KEY_ALIAS:$KEY_ALIAS"             "ANDROID_UPLOAD_KEY_PASSWORD:$KEY_PASSWORD"; do
            name="${pair%%:*}"
            value="${pair#*:}"
            if [ -z "$value" ]; then
              echo "::error::Eksik GitHub Actions secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::AAB signing secrets tamamlanmadan Play Store AAB üretilemez."
            exit 1
          fi
          echo 'AAB signing secrets mevcut.'

      - name: Release imza dosyasını hazırla
        if: github.event_name == 'workflow_dispatch' && inputs.build_release
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo 'İmzalı AAB için GitHub Actions secrets eksik. PLAY_RELEASE_GUIDE.md dosyasını izleyin.' >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          printf 'storeFile=upload-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/keystore.properties
          node scripts/configure-android-signing.mjs

      - name: Play Store ana ekran görsellerinin yeni UI'dan alındığını doğrula
        if: github.event_name == 'workflow_dispatch' && inputs.build_release && inputs.release_target == 'production'
        run: |
          set -euo pipefail
          while IFS='|' read -r file old_sha; do
            actual=$(sha256sum "$file" | awk '{print $1}')
            if [ "$actual" = "$old_sha" ]; then
              echo "HATA: $file hala eski ana ekran tasarımına ait. Gerçek son QA APK'dan yeni screenshot alınmadan AAB üretilemez." >&2
              exit 1
            fi
          done <<'OLD_SCREENSHOTS'
          play-store/screenshots/screenshot-01-home.png|a173bed4cb8e314cd318408e789dd2f0e66b2576361b366d0c4d1d0b41909976
          play-store/screenshots/en-US/screenshot-01-home.png|a76a02858198bd0e58cbff9a3e2620e8a47f33ef51209c08783f8151211a5917
          play-store/screenshots/es-ES/screenshot-01-home.png|89f358f680eeff517e65cefb3c7c5f87f3781543b8ac9c450d4cbdc0bc8205b4
          OLD_SCREENSHOTS
          echo 'Ana ekran mağaza görselleri eski UI hashlerinden farklı.'

      - name: İmzalı Play Store AAB derle
        if: github.event_name == 'workflow_dispatch' && inputs.build_release
        working-directory: android
        env:
          RELEASE_TARGET: ${{ inputs.release_target }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_TARGET" = "closed_test" ]; then
            export EXPO_PUBLIC_ADMOB_BANNER_ANDROID='ca-app-pub-3940256099942544/9214589741'
            export EXPO_PUBLIC_ADMOB_APP_OPEN_ANDROID='ca-app-pub-3940256099942544/9257395921'
            echo 'Closed-test AAB: Google demo reklam birimleri kullanılacak.'
          else
            export EXPO_PUBLIC_ADMOB_BANNER_ANDROID='ca-app-pub-1380972808968213/7265047779'
            export EXPO_PUBLIC_ADMOB_APP_OPEN_ANDROID='ca-app-pub-1380972808968213/1189880008'
            echo 'Production AAB: gerçek AdMob reklam birimleri kullanılacak.'
          fi
          set -o pipefail
          ./gradlew bundleRelease --no-daemon --stacktrace 2>&1 | tee ../gradle-release.log

      - name: AAB reklam profilini doğrula
        if: github.event_name == 'workflow_dispatch' && inputs.build_release
        env:
          RELEASE_TARGET: ${{ inputs.release_target }}
        run: |
          set -euo pipefail
          aab='android/app/build/outputs/bundle/release/app-release.aab'
          unzip -p "$aab" base/assets/app.config > aab-app.config.json
          if [ "$RELEASE_TARGET" = "closed_test" ]; then
            grep -Fq 'ca-app-pub-3940256099942544/9214589741' aab-app.config.json
            grep -Fq 'ca-app-pub-3940256099942544/9257395921' aab-app.config.json
            if grep -Eq '7265047779|1189880008' aab-app.config.json; then
              echo 'HATA: Closed-test AAB içinde production reklam birimi bulundu.' >&2
              exit 1
            fi
            echo 'Closed-test AAB yalnızca Google demo reklam birimlerini kullanıyor.'
          else
            grep -Fq 'ca-app-pub-1380972808968213/7265047779' aab-app.config.json
            grep -Fq 'ca-app-pub-1380972808968213/1189880008' aab-app.config.json
            if grep -Fq 'ca-app-pub-3940256099942544' aab-app.config.json; then
              echo 'HATA: Production AAB içinde Google demo reklam birimi bulundu.' >&2
              exit 1
            fi
            echo 'Production AAB gerçek AdMob reklam birimlerini kullanıyor.'
          fi

      - name: AAB upload imzasını doğrula
        if: github.event_name == 'workflow_dispatch' && inputs.build_release
        run: |
          set -euo pipefail
          aab='android/app/build/outputs/bundle/release/app-release.aab'
          jarsigner -verify "$aab"
          keytool -printcert -jarfile "$aab" > aab-certificate.txt
          if grep -Fq 'CN=Android Debug' aab-certificate.txt; then
            echo 'HATA: AAB Android Debug sertifikasıyla imzalanmış.' >&2
            exit 1
          fi
          grep -E 'Owner:|Issuer:|SHA256:' aab-certificate.txt || true
          echo 'AAB upload sertifikası doğrulandı.'

      - name: AAB 64-bit native kitaplıklarını 16 KB için doğrula
        if: github.event_name == 'workflow_dispatch' && inputs.build_release
        run: |
          set -euo pipefail
          aab='android/app/build/outputs/bundle/release/app-release.aab'
          native_dir=$(mktemp -d)
          unzip -q "$aab" 'base/lib/*/*.so' -d "$native_dir"
          found=0
          while IFS= read -r so; do
            found=1
            while IFS= read -r alignment; do
              if (( alignment < 0x4000 )); then
                echo "HATA: $so içindeki LOAD segmenti 16 KB hizalı değil: $alignment" >&2
                exit 1
              fi
            done < <(readelf -lW "$so" | awk '$1 == "LOAD" { print $NF }')
          done < <(find "$native_dir/base/lib" \( -path '*/arm64-v8a/*.so' -o -path '*/x86_64/*.so' \) -type f)
          if (( found == 0 )); then
            echo 'HATA: AAB içinde doğrulanacak 64-bit native kitaplık bulunamadı.' >&2
            exit 1
          fi
          echo 'AAB içindeki 64-bit native kitaplıkların ELF LOAD hizalaması 16 KB.'

      - name: Release log'unu yükle
        if: false  # PLAN2: Actions artifact quota bypass
        uses: actions/upload-artifact@v6
        with:
          name: release-log-v${{ github.run_number }}
          path: gradle-release.log
          retention-days: 14
          if-no-files-found: warn

      - name: İmzalı Play Store AAB'yi Actions artifact'ına yükle
        if: false  # PLAN2: Actions artifact quota bypass
        uses: actions/upload-artifact@v6
        with:
          name: pdf-okuyucu-${{ inputs.release_target }}-aab-v${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: quota-bypass delivery via draft GitHub Release
        if: ${{ success() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DELIVERY_DIR="quota-bypass-delivery"
          TAG="ci-delivery-${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}"
          rm -rf "$DELIVERY_DIR"
          mkdir -p "$DELIVERY_DIR"

          found=0
          if [ -d android/app/build/outputs ]; then
            while IFS= read -r file; do
              [ -s "$file" ] || continue
              safe="$(printf '%s' "$file" | sed 's#^android/app/build/outputs/##; s#[/ ]#__#g')"
              cp "$file" "$DELIVERY_DIR/${GITHUB_RUN_NUMBER}-${safe}"
              found=1
            done < <(
              find android/app/build/outputs -type f \
                \( -name '*.apk' -o -name '*.aab' \) \
                -print | sort
            )
          fi

          if [ "$found" -ne 1 ]; then
            echo "HATA: Teslim edilecek APK/AAB bulunamadi."
            find android/app/build/outputs -maxdepth 5 -type f -print 2>/dev/null | sort || true
            exit 1
          fi

          sha256sum "$DELIVERY_DIR"/* > "$DELIVERY_DIR/SHA256SUMS.txt"

          gh release create "$TAG" "$DELIVERY_DIR"/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "PDF Okuyucu CI Delivery #${GITHUB_RUN_NUMBER}" \
            --notes "Temporary quota-bypass delivery for commit ${GITHUB_SHA}. Generated by GitHub Actions run ${GITHUB_RUN_ID}, attempt ${GITHUB_RUN_ATTEMPT}." \
            --draft

          echo "DRAFT RELEASE DELIVERY PASS"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq '.url'
