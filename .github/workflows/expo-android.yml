name: Expo Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Bagimliliklar
        run: npm install --legacy-peer-deps

      - name: i18n ve TypeScript kontrolu
        run: |
          node scripts/check-i18n.mjs
          npx tsc --noEmit

      - name: Android projesini uret (expo prebuild)
        run: npx expo prebuild --platform android --clean

      - name: Debug APK derle
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Ciktilari listele
        run: find android/app/build/outputs -name "*.apk" | xargs ls -lh

      - uses: actions/upload-artifact@v4
        with:
          name: pdfokuyucu-expo-apk
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 30
