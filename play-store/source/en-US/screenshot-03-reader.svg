    <text x="180" y="980" fill="#1E293B" font-size="30" font-weight="800">Reading tools</text>
    <g fill="#334155" font-size="23"><text x="215" y="1045">•  Double-tap to zoom</text><text x="215" y="1095">•  Choose horizontal or vertical reading</text><text x="215" y="1145">•  Protect your eyes with night mode</text><text x="215" y="1195">•  Reading progress is saved automatically</text></g>
