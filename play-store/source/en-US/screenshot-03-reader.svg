    <text x="180" y="475" fill="#334155" font-size="24">PDF Reader displays your documents quickly</text><text x="180" y="515" fill="#334155" font-size="24">and securely. Every file remains on</text><text x="180" y="555" fill="#334155" font-size="24">your device.</text>
    <rect x="180" y="620" width="720" height="270" rx="28" fill="#EEF0FF"/>
