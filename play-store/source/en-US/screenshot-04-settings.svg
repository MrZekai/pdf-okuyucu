<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <rect width="1080" height="1920" fill="#0B1020"/>
  <g font-family="DejaVu Sans, sans-serif">
    <text x="64" y="98" fill="#6E7BEE" font-size="22" font-weight="900" letter-spacing="4">SETTINGS</text><text x="64" y="158" fill="#F8FAFC" font-size="50" font-weight="900">Your reading space</text><text x="64" y="205" fill="#8491A8" font-size="23">Manage reading behaviour, language and privacy.</text>
    <text x="68" y="288" fill="#66738A" font-size="20" font-weight="900" letter-spacing="4">LANGUAGE</text>
    <rect x="54" y="315" width="972" height="170" rx="38" fill="#11192B" stroke="#27304A" stroke-width="2"/>
    <rect x="72" y="330" width="936" height="48" rx="16" fill="#090F1E" stroke="#27304A"/><text x="102" y="362" fill="#5D6B84" font-size="20">⌕  Search languages</text>
    <rect x="72" y="390" width="450" height="70" rx="22" fill="#5662E6"/><text x="297" y="435" fill="#fff" font-size="23" font-weight="800" text-anchor="middle">✓  English</text><text x="760" y="435" fill="#738098" font-size="23" font-weight="800" text-anchor="middle">Deutsch</text>

    <text x="68" y="508" fill="#66738A" font-size="20" font-weight="900" letter-spacing="4">DEFAULT READING</text>
    <rect x="54" y="535" width="972" height="354" rx="38" fill="#11192B" stroke="#27304A" stroke-width="2"/>
    <g>
      <rect x="82" y="565" width="82" height="82" rx="26" fill="#5B67F1" fill-opacity=".1"/><path d="M145 590v34h-34M139 624c-28 16-55-15-37-39" fill="none" stroke="#8792FF" stroke-width="5"/>
      <text x="193" y="597" fill="#E5E7EB" font-size="27" font-weight="800">Horizontal reading</text><text x="193" y="634" fill="#6F7D95" font-size="20">Swipe pages left and right</text>
      <rect x="868" y="583" width="116" height="58" rx="29" fill="#5865E8"/><circle cx="955" cy="612" r="23" fill="#F8FAFC"/>
      <line x1="72" y1="666" x2="1008" y2="666" stroke="#27304A"/>
      <rect x="82" y="684" width="82" height="82" rx="26" fill="#5B67F1" fill-opacity=".1"/><rect x="104" y="703" width="38" height="44" fill="none" stroke="#8792FF" stroke-width="4"/>
      <text x="193" y="716" fill="#E5E7EB" font-size="27" font-weight="800">Snap to page</text><text x="193" y="753" fill="#6F7D95" font-size="20">Settle on a single page per swipe</text>
      <rect x="868" y="702" width="116" height="58" rx="29" fill="#283249"/><circle cx="897" cy="731" r="23" fill="#F8FAFC"/>
      <line x1="72" y1="785" x2="1008" y2="785" stroke="#27304A"/>
      <rect x="82" y="803" width="82" height="62" rx="22" fill="#5B67F1" fill-opacity=".1"/><path d="M137 814a25 25 0 1 0 21 36 20 20 0 0 1-21-36z" fill="none" stroke="#8792FF" stroke-width="4"/>
      <text x="193" y="833" fill="#E5E7EB" font-size="27" font-weight="800">PDF page night mode</text><text x="193" y="868" fill="#6F7D95" font-size="20">Only inverts the colours of PDF pages</text>
      <rect x="868" y="812" width="116" height="58" rx="29" fill="#5865E8"/><circle cx="955" cy="841" r="23" fill="#F8FAFC"/>
    </g>

    <text x="68" y="970" fill="#66738A" font-size="20" font-weight="900" letter-spacing="4">ADS &amp; PRIVACY</text>
    <rect x="54" y="997" width="972" height="250" rx="38" fill="#11192B" stroke="#27304A" stroke-width="2"/>
    <path d="M120 1029l33 13v25c0 25-14 43-33 53-20-10-33-28-33-53v-25z" fill="none" stroke="#34D399" stroke-width="5"/><path d="M106 1072l10 10 20-24" fill="none" stroke="#34D399" stroke-width="5"/>
    <text x="193" y="1057" fill="#E5E7EB" font-size="27" font-weight="800">Refresh ad consent</text><text x="193" y="1094" fill="#6F7D95" font-size="20">Re-check the Google UMP consent state</text><path d="M952 1054l18 18-18 18" fill="none" stroke="#64748B" stroke-width="5"/>
    <line x1="72" y1="1122" x2="1008" y2="1122" stroke="#27304A"/>
    <circle cx="120" cy="1182" r="31" fill="none" stroke="#38BDF8" stroke-width="5"/><path d="M120 1174v28M120 1158h1" stroke="#38BDF8" stroke-width="5"/>
    <text x="193" y="1173" fill="#E5E7EB" font-size="27" font-weight="800">Privacy policy</text><text x="193" y="1210" fill="#6F7D95" font-size="20">See how data is handled</text><path d="M952 1168l18 18-18 18" fill="none" stroke="#64748B" stroke-width="5"/>

    <text x="68" y="1328" fill="#66738A" font-size="20" font-weight="900" letter-spacing="4">DATA</text>
    <rect x="54" y="1355" width="972" height="126" rx="38" fill="#11192B" stroke="#27304A" stroke-width="2"/>
    <rect x="82" y="1377" width="82" height="82" rx="26" fill="#F87171" fill-opacity=".08"/><path d="M101 1400h44M111 1400v-12h24v12M106 1400l6 39h22l6-39" fill="none" stroke="#F87171" stroke-width="4"/>
    <text x="193" y="1409" fill="#FCA5A5" font-size="27" font-weight="800">Clear library</text><text x="193" y="1446" fill="#6F7D95" font-size="20">Delete local PDF copies and history</text>
    <rect x="0" y="1654" width="1080" height="116" fill="#10182A" stroke="#27304A" stroke-width="2"/><text x="540" y="1701" fill="#46536D" font-size="18" text-anchor="middle" letter-spacing="4">AD</text>
    <rect x="0" y="1770" width="1080" height="150" fill="#0B1020"/>
    <g font-size="19" font-weight="700" text-anchor="middle"><text x="135" y="1872" fill="#64748B">Home</text><text x="405" y="1872" fill="#64748B">Library</text><text x="675" y="1872" fill="#64748B">Tools</text><text x="945" y="1872" fill="#F8FAFC">Settings</text></g>
  </g>
</svg>
